<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistente</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Assistente">
<meta name="theme-color" content="#F3F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101713" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* ───────────────────────────────────────────────────────────────────────
   "Banco di lavoro" (docs/dashboard-v2/visual-spec.md): opaque surfaces,
   dark ink, crisp edges, one unmistakable next action. No glass, no
   gradients, no celebration. Every string from the server is set with
   textContent; the only markup built from strings is the constant icons.
   ─────────────────────────────────────────────────────────────────────── */
:root {
  color-scheme: light;
  --bg: #F3F5F0; --surface: #FFFFFF; --raised: #E9EEE8; --border: #7B857E; --line: #D3DAD2;
  --text: #17231C; --text-2: #435249; --muted: #58645E;
  --accent: #1859B8; --on-accent: #FFFFFF; --accent-soft: #E2EBF7;
  --success: #17613D; --warning: #815500; --danger: #AF2525;
  --success-soft: #E0EFE5; --warning-soft: #F5EBD5; --danger-soft: #F7E2E0;
  --wa: #25D366; --wa-ink: #102119; --wa-edge: #0B5D2F;
  --shadow: 0 8px 24px #00000024;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --nav-h: 64px; --safe-b: env(safe-area-inset-bottom, 0px); --dock-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #101713; --surface: #18221C; --raised: #223029; --border: #75817B; --line: #2E3C34;
    --text: #F3F6F1; --text-2: #CBD5CD; --muted: #ADB9B1;
    --accent: #91BBFF; --on-accent: #101713; --accent-soft: #1E2D42;
    --success: #81D4A2; --warning: #F2CA73; --danger: #FFAAA4;
    --success-soft: #1B3326; --warning-soft: #372F1E; --danger-soft: #3C2321;
    --wa-edge: #25D366; --shadow: 0 8px 24px #00000066; --line: #3A4A41;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101713; --surface: #18221C; --raised: #223029; --border: #75817B; --line: #2E3C34;
  --text: #F3F6F1; --text-2: #CBD5CD; --muted: #ADB9B1;
  --accent: #91BBFF; --on-accent: #101713; --accent-soft: #1E2D42;
  --success: #81D4A2; --warning: #F2CA73; --danger: #FFAAA4;
  --success-soft: #1B3326; --warning-soft: #372F1E; --danger-soft: #3C2321;
  --wa-edge: #25D366; --shadow: 0 8px 24px #00000066; --line: #3A4A41;
}

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
  font: 400 16px/24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 2px var(--surface); }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* type scale: title 28/34, section 20/26, body 16/24, meta 14/20, nav 12/16 */
h1 { font-size: 28px; line-height: 34px; font-weight: 700; margin: 0; }
h2 { font-size: 20px; line-height: 26px; font-weight: 700; margin: 0; }
h3 { font-size: 16px; line-height: 24px; font-weight: 700; margin: 0; }
p { margin: 0; }
.meta { font-size: 14px; line-height: 20px; color: var(--muted); }
.sec { color: var(--text-2); }
.section-title { font-size: 20px; line-height: 26px; font-weight: 700; margin: 32px 0 12px; }
.sub-title { font-size: 14px; line-height: 20px; font-weight: 700; color: var(--text-2); margin: 24px 0 8px; }

/* ── frame ─────────────────────────────────────────────────────────── */
main { padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(var(--nav-h) + var(--safe-b) + var(--dock-h) + 32px); }
.page { max-width: 640px; margin: 0 auto; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.page-head .meta { margin-top: 2px; }

.nav { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b); background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr); }
.nav .brand { display: none; }
.nav a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 48px; color: var(--muted); text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 600; }
.nav a svg.i { width: 22px; height: 22px; }
.nav a[aria-current="page"] { color: var(--accent); }
.nav a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 24%; right: 24%; height: 3px;
  background: var(--accent); border-radius: 0 0 3px 3px; }
.nav .dot { position: absolute; top: 8px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--danger); color: var(--surface); font-size: 12px; line-height: 18px; font-weight: 700; text-align: center; }
.pend-bar { position: fixed; z-index: 19; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b)); display: flex; align-items: center;
  gap: 12px; min-height: 56px; padding: 8px 16px; background: var(--warning-soft); color: var(--text); border-top: 1px solid var(--border); }
.pend-bar p { flex: 1; font-size: 14px; line-height: 20px; }

/* ── controls ──────────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-weight: 600; text-decoration: none; text-align: center; line-height: 20px;
  transition: transform 100ms var(--ease), background-color 100ms var(--ease); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled, .btn[aria-disabled="true"] { cursor: not-allowed; color: var(--muted); border-style: dashed; background: var(--raised); }
.btn.primary { min-height: 52px; background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 16px; }
.btn.primary:disabled { background: var(--raised); color: var(--muted); border-color: var(--border); }
.btn.wa { min-height: 52px; background: var(--wa); border-color: var(--wa-edge); color: var(--wa-ink); font-size: 16px; }
.btn.wa:disabled { background: var(--raised); color: var(--muted); border-color: var(--border); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--accent); }
.btn.block { display: flex; width: 100%; }
.btn .small { font-weight: 400; font-size: 14px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.linkish { background: none; border: 0; padding: 12px 0; min-height: 48px; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

label.field { display: block; margin-top: 12px; }
label.field > span { display: block; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
input[type="text"], input[type="search"], input[type="tel"], input[type="email"], input[type="url"], input[type="date"],
input[type="number"], select, textarea {
  width: 100%; min-height: 48px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text); font-size: 16px; line-height: 24px; }
textarea { resize: vertical; min-height: 120px; }
select { appearance: none; background-image: none; padding-right: 36px; }
.select-wrap { position: relative; }
.select-wrap svg.i { position: absolute; right: 12px; top: 14px; pointer-events: none; color: var(--muted); }
.field-error { color: var(--danger); font-size: 14px; line-height: 20px; margin-top: 4px; }
.help { font-size: 14px; line-height: 20px; color: var(--muted); margin-top: 4px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 48px; border: 0; border-right: 1px solid var(--line); background: transparent; font-weight: 600; font-size: 14px; color: var(--text-2); padding: 0 8px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.seg button:disabled { color: var(--muted); text-decoration: line-through; cursor: not-allowed; }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 2px 10px; border-radius: 14px;
  font-size: 14px; line-height: 20px; font-weight: 600; background: var(--raised); color: var(--text-2); border: 1px solid transparent; }
.chip svg.i { width: 16px; height: 16px; }
.chip.critical { background: var(--danger-soft); color: var(--danger); }
.chip.serious, .chip.warning { background: var(--warning-soft); color: var(--warning); }
.chip.ok { background: var(--success-soft); color: var(--success); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
button.chip { min-height: 48px; padding: 0 12px; border-color: var(--border); background: var(--surface); color: var(--text-2); border-radius: 24px; }
button.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.card + .card { margin-top: 12px; }
.panel-empty { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
.panel-empty h2 { margin-bottom: 8px; }
.panel-empty p { color: var(--text-2); margin-bottom: 16px; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--warning-soft); }
.notice.error { background: var(--danger-soft); }
.notice p { flex: 1; }
.notice svg.i { margin-top: 2px; color: var(--warning); }
.notice.error svg.i { color: var(--danger); }

/* ── Oggi ──────────────────────────────────────────────────────────── */
.progress { padding: 12px 16px; }
.progress .big { font-size: 20px; line-height: 26px; font-weight: 700; }
.progress .big .num { font-size: 28px; line-height: 32px; }
.allow { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.allow li { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 14px; line-height: 20px; color: var(--text-2); }
.allow li svg.i { width: 16px; height: 16px; }
.allow li .v { flex-basis: 100%; font-weight: 700; font-size: 20px; line-height: 26px; color: var(--text); }
.allow li .v.full { color: var(--warning); }
.allow li .tag { font-size: 12px; line-height: 16px; font-weight: 700; color: var(--warning); border: 1px solid currentColor; border-radius: 6px; padding: 1px 6px; }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.counts > div { display: flex; align-items: center; gap: 8px; padding: 8px 10px; min-height: 56px; }
.counts > div + div { border-left: 1px solid var(--line); }
.counts .n { font-size: 20px; line-height: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.counts .l { font-size: 12px; line-height: 15px; color: var(--text-2); font-weight: 600; }
.counts > .hot .n { color: var(--accent); }
.counts > .warn .n { color: var(--warning); }

.work { margin-top: 16px; }
.kicker { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--text-2); margin-bottom: 8px; }
.kicker.hot { color: var(--accent); }
.kicker.warn { color: var(--warning); }
.lead-card h2 { overflow-wrap: anywhere; }
.lead-card .where { margin-top: 2px; }
.evidence { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
.evidence .meta { display: inline-flex; align-items: center; gap: 4px; }
.facts { margin: 12px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.facts li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 20px; }
.facts li > span:first-child { color: var(--muted); width: 124px; flex: none; }
.facts li > span:last-child { overflow-wrap: anywhere; font-weight: 600; }
.msg { margin-top: 16px; }
.msg .fixed { padding: 12px; border-radius: 10px; background: var(--raised); color: var(--text-2); font-size: 14px; line-height: 20px; white-space: pre-line; }
.msg .fixed + label, .msg label + .fixed { margin-top: 8px; }
.msg label { display: block; }
.msg label > span { display: flex; justify-content: space-between; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text-2); margin: 8px 0 4px; }
.msg textarea { min-height: 132px; }
.clauses { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 14px; line-height: 20px; color: var(--success); }
.clauses span { display: inline-flex; align-items: center; gap: 4px; }
.clauses .bad { color: var(--danger); }
.clauses svg.i { width: 16px; height: 16px; }
.quiet-actions { margin-top: 16px; }
.quiet-actions .btn { font-size: 15px; padding: 0 8px; }
.exclude { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
@media (max-width: 400px) { .quiet-actions svg.i { display: none; } }
.card-links { margin-top: 8px; }
.card-links .btn { font-size: 15px; padding: 0 8px; }
.say { margin-top: 12px; padding: 12px; border-left: 3px solid var(--line); color: var(--text-2); font-size: 15px; line-height: 22px; }
.chan { margin-top: 16px; }
.chan .why { margin-top: 6px; }

.dock { position: fixed; z-index: 18; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b)); background: var(--surface);
  border-top: 1px solid var(--border); padding: 12px 16px; }
.dock .q { font-weight: 700; margin-bottom: 8px; overflow-wrap: anywhere; }
.dock .status { font-size: 14px; line-height: 20px; color: var(--text-2); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 12px; white-space: nowrap; }
.dock .status > span:first-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dock .status .warn { color: var(--warning); font-weight: 600; }
.dock .row + .row, .dock .row + .grid2, .dock .grid2 + .row { margin-top: 8px; }
.dock .err { color: var(--danger); font-size: 14px; line-height: 20px; margin-top: 8px; }
.dock .again { display: block; text-align: center; font-size: 14px; line-height: 20px; margin-top: 8px; min-height: 24px; }
.dock .inner { max-width: 608px; margin: 0 auto; }

.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.list > li + li { border-top: 1px solid var(--line); }
.list .item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 12px 16px; border: 0; background: none; text-align: left; text-decoration: none; color: var(--text); }
.list .item .grow { flex: 1; min-width: 0; }
.list .item .name { font-weight: 600; overflow-wrap: anywhere; }
.list .item .right { text-align: right; flex: none; max-width: 45%; }
.list .item svg.i { color: var(--muted); }
.list.rows .item { min-height: 88px; }
.state-lbl { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text-2); }
.late { color: var(--warning); font-weight: 600; }
.todo { color: var(--accent); font-weight: 600; }
.due { color: var(--warning); font-weight: 600; }

/* ── Contatti ──────────────────────────────────────────────────────── */
.search { position: relative; }
.search svg.i { position: absolute; left: 12px; top: 14px; color: var(--muted); }
.search input { padding-left: 42px; }
.filters { margin-top: 12px; }
.filters .chips { margin-bottom: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters .chips { display: contents; }
.filters .filter-grid { flex-basis: 100%; }
#more-filters { border-radius: 24px; padding: 0 14px; }
.filter-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.filter-grid label > span { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text-2); display: block; margin-bottom: 2px; }
.results-count { margin: 16px 0 8px; }
.table-wrap { display: none; }
table.leads { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 14px; line-height: 20px; }
table.leads th { text-align: left; padding: 0; background: var(--raised); border-bottom: 1px solid var(--border); }
table.leads th button { width: 100%; min-height: 44px; padding: 0 12px; border: 0; background: none; text-align: left; font-weight: 700; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
table.leads td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.leads tr { cursor: pointer; }
table.leads tbody tr:hover td { background: var(--raised); }
table.leads tr[aria-selected="true"] td { background: var(--accent-soft); }
table.leads td.name { font-weight: 600; font-size: 16px; line-height: 22px; }
table.leads td a { color: var(--text); text-decoration: none; }

/* ── lead detail ───────────────────────────────────────────────────── */
.detail-screen { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
.detail-top { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: calc(env(safe-area-inset-top, 0px) + 4px) 8px 4px; background: var(--surface); border-bottom: 1px solid var(--line); }
.detail-top .t { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; color: var(--text); border-radius: 10px; flex: none; }
.detail-body { flex: 1; overflow-y: auto; padding: 16px 16px 24px; overscroll-behavior: contain; }
.detail-body > .inner { max-width: 640px; margin: 0 auto; }
.detail-foot { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px calc(12px + var(--safe-b)); }
.detail-foot .inner { max-width: 640px; margin: 0 auto; }
.d-head h2 { font-size: 20px; line-height: 26px; overflow-wrap: anywhere; }
.d-head .chips { margin-top: 8px; }
.d-sec { margin-top: 24px; }
.d-sec > h3 { margin-bottom: 8px; }
.actions-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.proof { display: flex; gap: 12px; align-items: flex-start; }
.proof button { flex: none; padding: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--raised); overflow: hidden; width: 104px; height: 140px; }
.proof img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); margin-left: 6px; }
.timeline li { position: relative; padding: 0 0 14px 16px; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); }
.timeline .when { font-size: 14px; line-height: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.timeline .what { font-weight: 600; }
.timeline .det { font-size: 14px; line-height: 20px; color: var(--text-2); white-space: pre-line; overflow-wrap: anywhere; }
.notes { list-style: none; margin: 0 0 8px; padding: 0; }
.notes li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.notes .txt { white-space: pre-line; overflow-wrap: anywhere; }
.danger-zone { margin-top: 32px; padding: 16px; border: 1px solid var(--danger); border-radius: 12px; background: var(--danger-soft); }
.danger-zone p { color: var(--text); margin-bottom: 12px; font-size: 14px; line-height: 20px; }
.dnc-banner { margin-top: 12px; }
.detail-panel { display: none; }

/* ── sheets, toasts ────────────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; z-index: 40; background: #0000008C; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 92dvh; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border); border-bottom: 0; border-radius: 20px 20px 0 0; box-shadow: var(--shadow);
  animation: sheet-in 180ms var(--ease); }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; }
.sheet-body { overflow-y: auto; padding: 16px; overscroll-behavior: contain; }

function coverageRows(list, kind) {

/* ── theme, sign-in, start ──────────────────────────────────────────── */
