<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistente</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Assistente">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* ───────────────────────────────────────────────────────────────────────
   Liquid Glass. Controls float over the content as translucent, refracting
   material with a light-catching rim; the content glows through from an
   ambient field behind. Concentric radii, capsules for anything you press.
   Data marks keep the validated series blue - UI glass and chart ink are
   different jobs.
   ─────────────────────────────────────────────────────────────────────── */
:root {
  color-scheme: dark;
  --ink: #ffffff; --ink-2: rgba(255,255,255,.66); --ink-3: rgba(255,255,255,.38);
  --bg: #05060a;
  --glass: rgba(255,255,255,.07); --glass-hi: rgba(255,255,255,.12); --glass-strong: rgba(30,32,40,.55);
  --rim: rgba(255,255,255,.28); --rim-soft: rgba(255,255,255,.08);
  --shadow: 0 18px 50px -12px rgba(0,0,0,.65);
  --green: #32d74b; --green-2: #0fb33a; --blue: #3b9bff; --indigo: #6b5cff;
  --red: #ff5a52; --orange: #ffa53a; --yellow: #ffd84d;
  --orb-1: #1b3a8a; --orb-2: #3b2475; --orb-3: #0b4f4a;
  --series: #3987e5; --grid: rgba(255,255,255,.08);
  --wa-ink: #4ce36a;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --ink: #0b0c10; --ink-2: rgba(11,12,16,.62); --ink-3: rgba(11,12,16,.34);
    --bg: #eef0f6;
    --glass: rgba(255,255,255,.52); --glass-hi: rgba(255,255,255,.72); --glass-strong: rgba(255,255,255,.72);
    --rim: rgba(255,255,255,.95); --rim-soft: rgba(0,0,0,.04);
    --shadow: 0 18px 40px -16px rgba(40,50,90,.28);
    --orb-1: #8fb4ff; --orb-2: #c7a8ff; --orb-3: #8ff0dc;
    --series: #2a78d6; --grid: rgba(11,12,16,.07);
    --wa-ink: #0a7d2c;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --ink: #0b0c10; --ink-2: rgba(11,12,16,.62); --ink-3: rgba(11,12,16,.34); --bg: #eef0f6;
  --glass: rgba(255,255,255,.52); --glass-hi: rgba(255,255,255,.72); --glass-strong: rgba(255,255,255,.72);
  --rim: rgba(255,255,255,.95); --rim-soft: rgba(0,0,0,.04); --shadow: 0 18px 40px -16px rgba(40,50,90,.28);
  --orb-1: #8fb4ff; --orb-2: #c7a8ff; --orb-3: #8ff0dc; --series: #2a78d6; --grid: rgba(11,12,16,.07);
  --wa-ink: #0a7d2c;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--ink); background: transparent;
  /* SF on Apple devices; Inter is the closest open face elsewhere. Without it
     Linux and some Android builds fall back to a far wider sans, and a phone
     number wraps onto two lines. */
  font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Inter Variable", system-ui, sans-serif;
  letter-spacing: -.02em; -webkit-font-smoothing: antialiased;
  padding: calc(env(safe-area-inset-top) + 8px) 0 calc(110px + env(safe-area-inset-bottom));
  min-height: 100vh; overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; letter-spacing: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 18px; }
.num { font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }

/* The ambient field the glass refracts. Drifts slowly; still for reduced motion. */
/* Pre-soft radial gradients rather than filter: blur on screen-sized layers:
   the blur made first paint visibly slow under the glass, and a gradient
   that is already soft looks the same for almost nothing. */
.ambient { position: fixed; inset: -10vmax; z-index: -1; pointer-events: none; opacity: .9; }
.ambient i { position: absolute; border-radius: 50%; will-change: transform; }
.ambient i:nth-child(1) { width: 80vmax; height: 80vmax; left: -10%; top: -10%; background: radial-gradient(closest-side, var(--orb-1), transparent); animation: drift1 26s ease-in-out infinite alternate; }
.ambient i:nth-child(2) { width: 70vmax; height: 70vmax; right: -15%; top: 25%; background: radial-gradient(closest-side, var(--orb-2), transparent); animation: drift2 32s ease-in-out infinite alternate; }
.ambient i:nth-child(3) { width: 64vmax; height: 64vmax; left: 5%; bottom: -15%; background: radial-gradient(closest-side, var(--orb-3), transparent); animation: drift1 38s ease-in-out infinite alternate-reverse; }
/* A vignette keeps the title zone calm: the light sits behind the content,
   not in competition with the large title. */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 70% at 50% 110%, transparent 35%, rgba(0,0,0,.35) 75%), linear-gradient(180deg, rgba(0,0,0,.55), transparent 32%); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) body::before { background: linear-gradient(180deg, rgba(255,255,255,.6), transparent 34%); } }
@keyframes drift1 { to { transform: translate(8vmax, 6vmax) scale(1.08); } }
@keyframes drift2 { to { transform: translate(-7vmax, -5vmax) scale(.94); } }

/* The material. A soft body, a rim that catches light at the top edge, and a
   float shadow. The rim is drawn with a masked gradient border so it thins
   toward the bottom, the way a real edge does. */
.glass {
  position: relative; isolation: isolate;
  background: linear-gradient(160deg, var(--glass-hi), var(--glass) 55%);
  -webkit-backdrop-filter: blur(30px) saturate(190%); backdrop-filter: blur(30px) saturate(190%);
  box-shadow: var(--shadow), inset 0 1px 0 0 var(--rim-soft);
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(170deg, var(--rim), transparent 38%, transparent 70%, rgba(255,255,255,.14));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}

/* Large title: heavier and tighter, as in iOS 26 */
.head { padding: 14px 4px 18px; }
.head .eyebrow { font-size: 14px; font-weight: 600; color: var(--ink-2); letter-spacing: -.01em; }
.head h1 { font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -.035em; margin: 4px 0 0; }
.head .sub { font-size: 15px; color: var(--ink-2); margin-top: 6px; }
.label { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; text-transform: uppercase; margin: 26px 6px 10px; }
.footnote { font-size: 13px; color: var(--ink-3); margin: 12px 6px 0; line-height: 1.4; }

/* ── Oggi ─────────────────────────────────────────────── */
.today { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 18px 20px; border-radius: 30px; }
.ring { width: 76px; height: 76px; }
.ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
.ring .track { stroke: rgba(127,127,127,.22); }
.ring .value { stroke: url(#ringgrad); transform: rotate(-90deg); transform-origin: 50% 50%;
  transition: stroke-dashoffset .9s cubic-bezier(.2,.9,.2,1); filter: drop-shadow(0 0 6px rgba(50,215,75,.55)); }
.today .big { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.today .big small { font-size: 18px; font-weight: 600; color: var(--ink-3); }
.today .caption { font-size: 15px; color: var(--ink-2); margin-top: 6px; }

.hero { margin-top: 14px; padding: 24px 22px 20px; border-radius: 34px; overflow: hidden; }
.hero::after { content: ""; position: absolute; z-index: -1; inset: -40% -20% auto auto; width: 70%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, var(--tone, rgba(59,155,255,.35)), transparent 65%); filter: blur(10px); pointer-events: none; }
.hero .meta { display: flex; align-items: center; gap: 10px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 16px;
  color: #fff; letter-spacing: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px -6px rgba(0,0,0,.5); }
.hero .kicker { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.hero h2 { font-size: 30px; line-height: 1.08; font-weight: 800; letter-spacing: -.03em; margin: 16px 0 14px; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px 0 12px; border-radius: 17px;
  font-size: 15px; font-weight: 600; background: rgba(127,127,127,.14); }
.chip .glow { width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.tone-critical { color: var(--red); } .tone-serious { color: var(--orange); }
.tone-warning { color: var(--yellow); } .tone-neutral { color: var(--ink-2); }
.chip span:last-child { color: var(--ink); }
.dial { display: block; font-size: clamp(24px, 8vw, 30px); font-weight: 600; letter-spacing: .01em; margin: 22px 0 18px;
  white-space: nowrap; overflow: hidden; text-overflow: clip; }   /* a number must never wrap */

.call { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 60px; border-radius: 30px;
  color: #fff; font-size: 19px; font-weight: 700; letter-spacing: -.01em;
  background: linear-gradient(180deg, #4ce36a, var(--green-2));
  box-shadow: 0 12px 30px -10px rgba(50,215,75,.75), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 6px rgba(0,0,0,.12);
  transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.call svg { width: 22px; height: 22px; }
/* WhatsApp's own green, so the primary action says where it goes before it is read. */
.call.wa-go { background: linear-gradient(180deg, #3be07a, #1faa54);
  box-shadow: 0 12px 30px -10px rgba(37,211,102,.75), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 6px rgba(0,0,0,.12); }
.call:active { transform: scale(.97); }
.pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.pill { display: flex; align-items: center; justify-content: center; gap: 7px; height: 48px; border-radius: 24px; font-size: 15px; font-weight: 600; white-space: nowrap; min-width: 0; padding: 0 8px;
  transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.pill svg { width: 17px; height: 17px; opacity: .9; }
.pill:active { transform: scale(.95); }
.say { max-height: 0; overflow: hidden; transition: max-height .45s cubic-bezier(.2,.9,.2,1), margin .3s; }
.say.open { max-height: 760px; margin-top: 14px; }
.say .inner { padding: 16px 18px; border-radius: 22px; background: rgba(127,127,127,.12); font-size: 16px; line-height: 1.45; white-space: pre-line; }
.attempt { font-size: 13px; color: var(--orange); margin-top: 10px; text-align: center; }
.queue { text-align: center; font-size: 14px; color: var(--ink-3); margin-top: 16px; }

.done { text-align: center; padding: 50px 24px 40px; border-radius: 34px; margin-top: 14px; }
.done .check { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 18px; display: grid; place-items: center;
  background: linear-gradient(180deg, #4ce36a, var(--green-2)); box-shadow: 0 16px 40px -12px rgba(50,215,75,.8), inset 0 1px 0 rgba(255,255,255,.5); }
.done h2 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 6px; }
.done p { color: var(--ink-2); margin: 0; }

/* ── Lead ─────────────────────────────────────────────── */
.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px; border-radius: 24px; }
.search svg { width: 18px; height: 18px; color: var(--ink-2); flex: none; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; font: inherit; font-size: 17px; color: var(--ink); outline: none; }
.search input::placeholder { color: var(--ink-3); }
.seg { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); height: 44px; padding: 4px; border-radius: 22px; margin: 12px 0 6px; }
.seg .lens { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 18px; background: var(--glass-hi);
  box-shadow: 0 4px 14px -4px rgba(0,0,0,.4), inset 0 1px 0 var(--rim); transition: transform .45s cubic-bezier(.3,1.35,.5,1), width .3s; }
.seg button { position: relative; z-index: 1; font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; transition: color .2s; }
.seg button[aria-pressed="true"] { color: var(--ink); }
/* minmax(0,1fr): an auto grid column grows to the longest unbroken name,
   which pushed every row past the screen edge and hid the state badge. */
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 12px; }
.lead { display: flex; align-items: center; gap: 14px; width: 100%; min-width: 0; padding: 14px 16px; border-radius: 26px; text-align: left;
  transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.lead:active { transform: scale(.98); }
.lead .avatar { width: 42px; height: 42px; font-size: 15px; }
.lead .text { flex: 1; min-width: 0; }
.lead .title { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lead .sub2 { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; }
.lead .sub2 .glow { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; flex: none; }
.lead .sub2 span:last-child { overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.state { font-size: 12px; font-weight: 700; letter-spacing: .02em; padding: 5px 10px; border-radius: 12px; background: rgba(127,127,127,.14); color: var(--ink-2); flex: none; }
.state.hot { background: rgba(255,165,58,.18); color: var(--orange); }
.state.warm { background: rgba(59,155,255,.16); color: var(--blue); }
.state.msg { background: rgba(37,211,102,.16); color: var(--wa-ink); }   /* not .wa: that is the big button */
.empty { padding: 40px 16px; text-align: center; color: var(--ink-2); border-radius: 26px; }

/* Loading: a shimmer in the shape of what is coming, never a blank screen */
.skel { border-radius: 26px; height: 72px; background: linear-gradient(100deg, var(--glass) 30%, var(--glass-hi) 50%, var(--glass) 70%);
  background-size: 300% 100%; animation: shimmer 1.4s ease-in-out infinite; }
.skel.tall { height: 150px; border-radius: 30px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

/* ── Sito ─────────────────────────────────────────────── */
.stat { padding: 22px 22px 20px; border-radius: 32px; }
.stat .n { font-size: 64px; line-height: .95; font-weight: 800; letter-spacing: -.045em;
  background: linear-gradient(180deg, var(--ink), color-mix(in srgb, var(--ink) 55%, var(--blue))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat .what { font-size: 15px; color: var(--ink-2); margin-top: 10px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.tile { padding: 16px 18px; border-radius: 26px; }
.tile .k { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tile .v { font-size: 30px; font-weight: 700; letter-spacing: -.03em; margin-top: 6px; }
.tile .d { font-size: 13px; font-weight: 600; margin-top: 4px; color: var(--ink-3); }
.up { color: var(--green) !important; } .down { color: var(--red) !important; }
.chart { padding: 20px 18px 14px; border-radius: 32px; margin-top: 10px; }
.chart h3 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
.chart .caption { font-size: 13px; color: var(--ink-2); margin: 3px 0 12px; }
.chart svg { display: block; width: 100%; height: 180px; overflow: visible; }
.chart .ax { fill: var(--ink-3); font-size: 11px; letter-spacing: 0; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .bar { fill: var(--series); transition: opacity .2s; }
.chart .bar.dim { opacity: .35; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .dlabel { fill: var(--ink); font-size: 11px; font-weight: 700; letter-spacing: 0; }
.tip { position: absolute; pointer-events: none; padding: 8px 12px; border-radius: 16px; font-size: 13px; color: var(--ink-2);
  white-space: nowrap; transform: translate(-50%, calc(-100% - 6px)) scale(.9); opacity: 0; transition: opacity .15s, transform .25s cubic-bezier(.3,1.5,.5,1); }
.tip strong { display: block; font-size: 16px; color: var(--ink); }
.tip.on { opacity: 1; transform: translate(-50%, calc(-100% - 6px)) scale(1); }

/* ── Sistema ──────────────────────────────────────────── */
.health { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 30px; }
.health .orb { width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center; }
.health .orb.ok { background: radial-gradient(circle at 35% 30%, #7ff29a, var(--green-2)); box-shadow: 0 0 30px -4px rgba(50,215,75,.7); }
.health .orb.bad { background: radial-gradient(circle at 35% 30%, #ff9a94, #d9302a); box-shadow: 0 0 30px -4px rgba(255,90,82,.7); }
.health .t { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.health .s { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.svc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.svc .glass { padding: 16px; border-radius: 24px; }
.svc .name { font-size: 15px; font-weight: 600; }
.svc .st { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; margin-top: 8px; }
.svc .st i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.ok { color: var(--green); } .bad { color: var(--red); }
.meter-row { padding: 18px 20px; border-radius: 28px; }
.meter-row .top { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; }
.meter-row .top span:last-child { color: var(--ink-2); font-weight: 500; }
.meter { height: 8px; border-radius: 4px; background: rgba(127,127,127,.16); margin: 10px 0 0; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--blue), var(--indigo)); box-shadow: 0 0 12px rgba(59,155,255,.5); }
.meter-row + .meter-row { margin-top: 10px; }

/* ── Floating tab bar: a glass capsule with a lens that slides ─────────── */
nav.tabs { position: fixed; z-index: 10; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  display: grid; grid-template-columns: repeat(4, 1fr); width: min(360px, calc(100% - 36px)); height: 66px; padding: 6px;
  border-radius: 33px; transition: height .35s cubic-bezier(.3,1.2,.5,1), width .35s cubic-bezier(.3,1.2,.5,1); }
nav.tabs .lens { position: absolute; top: 6px; bottom: 6px; left: 6px; border-radius: 27px; background: var(--glass-hi);
  box-shadow: inset 0 1px 0 var(--rim), 0 6px 18px -6px rgba(0,0,0,.45); transition: transform .5s cubic-bezier(.3,1.35,.5,1); }
nav.tabs button { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; font-weight: 600; color: var(--ink-2); transition: color .25s; }
nav.tabs button svg { width: 25px; height: 25px; transition: transform .4s cubic-bezier(.3,1.6,.5,1); }
nav.tabs button[aria-selected="true"] { color: var(--blue); }
nav.tabs button[aria-selected="true"] svg { transform: scale(1.08); }
nav.tabs.compact { height: 54px; width: min(300px, calc(100% - 60px)); }
nav.tabs.compact .tl { display: none; }
.ico { position: relative; display: flex; }
.badge { position: absolute; left: 16px; top: -6px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
  background: var(--red); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px; box-shadow: 0 0 12px rgba(255,90,82,.6); }

/* ── Sheets: floating glass, inset from the edges, all corners round ──── */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .3s;
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 21; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 620px; margin: 0 auto;
  max-height: 88vh; overflow-y: auto; border-radius: 38px; padding: 10px 18px 18px;
  background: linear-gradient(170deg, var(--glass-strong), color-mix(in srgb, var(--glass-strong) 80%, transparent));
  transform: translateY(calc(100% + 30px)) scale(.96); transition: transform .5s cubic-bezier(.32,1.12,.4,1); }
.sheet.on { transform: none; }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--ink-3); margin: 0 auto 16px; }
.sheet h3 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; text-align: center; margin: 0 0 4px; }
.sheet .q { text-align: center; font-size: 15px; color: var(--ink-2); margin: 0 0 18px; }
.outcomes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.outcome { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; border-radius: 26px; text-align: left;
  font-size: 16px; font-weight: 700; letter-spacing: -.01em; min-height: 104px; transition: transform .25s cubic-bezier(.3,1.6,.5,1); }

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return n;
};
const svg = (m) => { const t = document.createElement("template"); t.innerHTML = m.trim(); return t.content.firstChild; };

async function api(path, body) {
  const opts = { credentials: "same-origin", headers: { "X-Requested-With": "app" } };
  if (body !== undefined) { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  if (r.status === 401) { showSignin(); throw new Error("signin"); }
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

let toastTimer;
function toast(text, icon) {
  const t = $("#toast"); t.replaceChildren(icon ? svg(icon) : "", text); t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 1700);
}
const haptic = () => { try { navigator.vibrate?.(10); } catch {} };

// Italian numbers, grouped the way the Phone app shows them.
function formatPhone(p) {
  if (!p) return "";
  let d = p.replace(/[^\d+]/g, "");
  let cc = "";
  if (d.startsWith("+39")) { cc = "+39 "; d = d.slice(3); } else if (d.startsWith("0039")) { cc = "+39 "; d = d.slice(4); }
  let head;
  if (d.startsWith("3")) head = d.slice(0, 3);                       // mobile
  else if (/^0[26]/.test(d)) head = d.slice(0, 2);                   // Milano, Roma
  else head = d.slice(0, 3);                                         // other areas
  const rest = d.slice(head.length);
  const tail = rest.length > 4 ? rest.slice(0, rest.length - 4) + " " + rest.slice(-4) : rest;
  return (cc + head + " " + tail).trim();
}

// Contacts-style monogram, hue fixed per category so a list reads at a glance.
const HUES = { dentisti: 212, veterinari: 150, commercialisti: 265, avvocati: 20, architetti: 330, fisioterapisti: 185, notai: 45, psicologi: 290 };
function avatar(name, category) {
  // Skip the words that describe the category rather than name the practice:
  // "Studio Dentistico Dottor Forcellini" is F, not DD.
  const generic = /^(studio|studi|dentistic[oai]|odontoiatric[oai]|dott(or|ore|\.)?|dr\.?|dott\.ssa|ambulatori[oa]|centro|clinica|dental[ei]?|veterinari[oa]|associat[oi]|legale|commercialista|architett[oai]|fisioterapi[ac]|di|del|della|e|&|s\.?r\.?l\.?)$/i;
  const all = (name || "?").replace(/[^\p{L}\s&.]/gu, " ").split(/\s+/).filter(Boolean);
  const words = all.filter((w) => !generic.test(w)).length ? all.filter((w) => !generic.test(w)) : all;
  const initials = ((words[0] || "?")[0] + (words[1] ? words[1][0] : "")).toUpperCase();
  const h = HUES[category] ?? 220;
  return el("span", { class: "avatar", style: `background:linear-gradient(160deg,hsl(${h} 80% 62%),hsl(${h + 25} 70% 45%))`, "aria-hidden": "true" }, initials);
}

/* ── sign in ─────────────────────────────────────────── */
function showSignin() {
  $("#app").hidden = true; $("#tabs").hidden = true; $("#signin").hidden = false;
  setTimeout(() => $("#code").focus(), 300);
}
$("#code").addEventListener("input", async (e) => {
  const code = e.target.value.replace(/\D/g, "").slice(0, 6);
  e.target.value = code; $("#err").textContent = "";
  if (code.length < 6) return;
  try { await api("/api/pair", { code }); $("#signin").hidden = true; start(); }
  catch (err) { if (err.message !== "signin") { $("#err").textContent = err.message; e.target.value = ""; } }
});

/* ── tabs, with a lens that slides under the selection ── */
const loaders = {};
let current = "oggi";
function moveLens(lens, container, button) {
  const c = container.getBoundingClientRect(), b = button.getBoundingClientRect();
  lens.style.width = b.width + "px";
  lens.style.transform = `translateX(${b.left - c.left - 6}px)`;
}
function show(tab) {
  current = tab;
  const nav = $("#tabs");
  for (const b of nav.querySelectorAll("button")) {
    const on = b.dataset.tab === tab; b.setAttribute("aria-selected", on);
    if (on) requestAnimationFrame(() => moveLens($("#tab-lens"), nav, b));
  }
  for (const s of document.querySelectorAll("main > section")) {
    const on = s.id === "tab-" + tab; s.hidden = !on;
    if (on) { s.classList.remove("enter"); void s.offsetWidth; s.classList.add("enter"); }
  }
  window.scrollTo({ top: 0 });
  loaders[tab]?.();
}
for (const b of document.querySelectorAll("nav.tabs button")) b.addEventListener("click", () => { haptic(); show(b.dataset.tab); });
// The bar steps back while you read, and returns when you scroll up.
let lastY = 0;
addEventListener("scroll", () => {
  const y = scrollY, nav = $("#tabs");
  if (y > lastY + 6 && y > 80) nav.classList.add("compact"); else if (y < lastY - 6) nav.classList.remove("compact");
  lastY = y;
  setTimeout(() => { const b = nav.querySelector('[aria-selected="true"]'); if (b) moveLens($("#tab-lens"), nav, b); }, 360);
}, { passive: true });
addEventListener("resize", () => { const nav = $("#tabs"), b = nav.querySelector('[aria-selected="true"]'); if (b) moveLens($("#tab-lens"), nav, b); });

/* ── sheets ──────────────────────────────────────────── */
function openSheet(content) {
  const sh = $("#sheet"); sh.replaceChildren(el("div", { class: "grabber" }), content);
  $("#scrim").classList.add("on"); sh.classList.add("on");
}
function closeSheet() { $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }
$("#scrim").addEventListener("click", closeSheet);

/* ── Oggi ────────────────────────────────────────────── */
const I = {
  phone: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 5 5.7 5 10.5A5 5 0 0 1 12 22a5 5 0 0 1-5-5c0-2.2 1.2-3.6 2.5-4.8.3 1.3 1 2.3 2 2.8-.6-3.4.5-6.4.5-13z"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  missed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6 6 5-5 4 4"/><path d="M18 8v4h-4"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
  bubble: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c5 0 9 3.4 9 7.7s-4 7.7-9 7.7c-1 0-1.9-.1-2.8-.4L4.6 20c-.4.2-.9-.2-.7-.7l1.1-3.3A7.2 7.2 0 0 1 3 10.7C3 6.4 7 3 12 3z"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 21V4.2c0-.4.2-.7.6-.9 3-1.3 5.2 1.4 8.4.1 1.4-.6 3.2-.5 4.4.3.4.3.6.7.6 1.1v8.4c0 .6-.6 1-1.2.8-1.4-.5-2.7-.4-3.8.1-3.2 1.4-5.4-1.3-8.9.1V21H5z"/></svg>',
  skip: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 6.3v11.4c0 .8.9 1.3 1.6.8l8-5.7c.6-.4.6-1.2 0-1.6l-8-5.7C5.9 5 5 5.5 5 6.3z"/><rect x="16.5" y="5.5" width="2.8" height="13" rx="1.4"/></svg>',
};
const OUTCOMES = [
  ["ok", "Ho parlato con loro", "check", "#30c85a"],
  ["hot", "Sono interessati", "flame", "#ff9f0a"],
  ["later", "Da richiamare", "clock", "#3b9bff"],
  ["noanswer", "Non ha risposto", "missed", "#8e8e93"],
  ["no", "Non interessati", "x", "#ff453a", true],
];
// After a WhatsApp: whether it went, then what came back.
const WA_OUTCOMES = [
  ["wa_sent", "Messaggio inviato", "check", "#30c85a"],
  ["hot", "Interessati", "flame", "#ff9f0a"],
  ["ok", "Hanno risposto", "bubble", "#3b9bff"],
  ["no", "Non interessati", "x", "#ff453a"],
];
const TONE = { critical: "rgba(255,90,82,.45)", serious: "rgba(255,165,58,.4)", warning: "rgba(255,216,77,.35)", neutral: "rgba(59,155,255,.3)" };
let pendingCall = null, pendingWa = null;

function ring(done, goal) {
  const c = 201, pct = Math.min(1, done / Math.max(goal, 1));
  $("#ring").style.strokeDashoffset = String(c * (1 - pct));
  $("#done-count").replaceChildren(String(done), " ", el("small", {}, "/ " + goal));
}

function heroCard(lead) {
  const wa = lead.channel === "whatsapp";
  const tel = (lead.phone || "").replace(/[^\d+]/g, "");
  const say = el("div", { class: "say" }, el("div", { class: "inner" }, (wa ? lead.message : lead.draft) || "Nessuna bozza per questo lead."));
  const sayBtn = el("button", { class: "glass pill", onclick: () => { haptic(); say.classList.toggle("open"); } }, svg(I.bubble), wa ? "Leggi" : "Cosa dire");
  // WhatsApp opens with the message already written; Momo reads it there and
  // presses send himself. Nothing leaves from here.
  const go = () => { haptic(); pendingWa = lead; };
  const number = wa
    ? el("a", { class: "dial num", href: lead.wa_app, onclick: go }, formatPhone("+" + lead.mobile))
    : el("a", { class: "dial num", href: "tel:" + tel }, formatPhone(lead.phone));
  const primary = wa
    ? el("a", { class: "call wa-go", href: lead.wa_app, onclick: go }, svg(I.bubble), "Scrivi su WhatsApp")
    : el("a", { class: "call", href: "tel:" + tel, onclick: () => { haptic(); pendingCall = lead; } }, svg(I.phone), "Chiama");
  return el("div", { class: "glass hero", style: "--tone:" + TONE[lead.tone] },
    el("div", { class: "meta" }, avatar(lead.name, lead.category),
      el("div", {}, el("div", { class: "kicker" }, [lead.category, lead.city].filter(Boolean).map((x) => x[0].toUpperCase() + x.slice(1)).join(" · ")))),
    el("h2", {}, lead.name),
    lead.problem ? el("span", { class: "chip tone-" + lead.tone }, el("span", { class: "glow", "aria-hidden": "true" }), el("span", {}, lead.problem)) : null,
    number, primary,
    el("div", { class: "pills" }, sayBtn,
      el("button", { class: "glass pill", onclick: () => { haptic(); askOutcome(lead, lead.channel); } }, svg(I.flag), "Esito"),
      el("button", { class: "glass pill", onclick: () => { haptic(); record(lead, "skip"); } }, svg(I.skip), "Salta")),
    lead.attempts && !wa ? el("div", { class: "attempt" }, `Tentativo n. ${lead.attempts + 1}`) : null,
    say);
}

async function loadOggi() {
  try {
    const t = await api("/api/today");
    const d = new Date(t.date + "T12:00:00");
    const day = d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
    $("#today-date").textContent = day[0].toUpperCase() + day.slice(1);
    ring(t.done, t.goal);
    const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
    $("#done-caption").textContent = t.done
      ? `${t.messages} WhatsApp · ${plural(t.calls, "chiamata", "chiamate")} oggi`
      : "contatti oggi";
    const badge = $("#badge"); badge.hidden = !t.remaining; badge.textContent = t.remaining > 99 ? "99+" : t.remaining;
    const box = $("#next");
    if (!t.next) {
      box.replaceChildren(el("div", { class: "glass done" },
        el("div", { class: "check" }, svg('<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>')),
        el("h2", {}, "Hai finito per oggi"), el("p", {}, "Chi non ha risposto torna domani.")));
      return;
    }
    const capped = t.next.channel === "call" && t.messages >= t.message_cap;
    box.replaceChildren(el("div", { class: "label" }, t.next.channel === "whatsapp" ? "Prossimo messaggio" : "Prossima chiamata"), heroCard(t.next),
      el("div", { class: "queue" }, capped ? `WhatsApp: ${t.message_cap} nuovi contatti oggi, il resto domani`
        : t.remaining > 1 ? `Poi ne restano ${t.remaining - 1}` : "È l'ultimo di oggi"));
  } catch (e) { if (e.message !== "signin") toast("Non riesco a caricare"); }
}
loaders.oggi = loadOggi;

function askOutcome(lead, channel) {
  const wa = channel === "whatsapp";
  openSheet(el("div", {},
    el("h3", {}, lead.name), el("p", { class: "q" }, wa ? "Com'è andata su WhatsApp?" : "Com'è andata?"),
    el("div", { class: "outcomes" }, (wa ? WA_OUTCOMES : OUTCOMES).map(([action, label, icon, color, wide]) =>
      el("button", { class: "glass outcome" + (wide ? " wide" : ""), onclick: () => { haptic(); closeSheet(); record(lead, action, channel); } },
        el("span", { class: "em", style: `background:${color};--c:${color}` }, svg(I[icon])), label))),
    el("button", { class: "glass cancel", onclick: closeSheet }, "Annulla")));
}

// Back from WhatsApp: the one question that matters, with the answer that
// is almost always right as the big button.
function askSent(lead) {
  openSheet(el("div", {},
    el("h3", {}, lead.name), el("p", { class: "q" }, "Hai inviato il messaggio?"),
    el("div", { class: "outcomes" },
      el("button", { class: "glass outcome wide", onclick: () => { haptic(); closeSheet(); record(lead, "wa_sent", "whatsapp"); } },
        el("span", { class: "em", style: "background:#30c85a;--c:#30c85a" }, svg(I.check)), "Sì, inviato")),
    el("button", { class: "glass cancel", onclick: closeSheet }, "Non ancora")));
}

async function record(lead, action, channel) {
  try {
    await api("/api/outcome", { id: lead.id, action, channel: channel || "call" });
    toast(action === "skip" ? "Saltato" : action === "wa_sent" ? "Inviato" : "Registrato", action === "skip" ? null : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#32d74b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>');
    await (loaders[current] || loadOggi)();   // the Lead list too, when recorded from there
  } catch (e) { if (e.message !== "signin") toast("Errore: " + e.message); }
}

// Back from the Phone app: ask how it went, at the moment it matters.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (pendingWa) { const lead = pendingWa; pendingWa = null; setTimeout(() => askSent(lead), 400); }
  else if (pendingCall) { const lead = pendingCall; pendingCall = null; setTimeout(() => askOutcome(lead, "call"), 400); }
  else loaders[current]?.();
});

/* ── Lead ────────────────────────────────────────────── */
let leadState = "todo", searchTimer;
const STATE = { NEW: ["Nuovo", ""], WHATSAPP_SENT: ["WhatsApp", "warm"], EMAIL_SENT: ["Email", "warm"], CALL_DUE: ["Da chiamare", ""],
                CONTACTED: ["Sentito", "warm"], INTERESTED: ["Caldo", "hot"], DEAD: ["Archiviato", ""] };
function skeletons(n) { return Array.from({ length: n }, () => el("div", { class: "skel" })); }

async function loadLead() {
  const list = $("#lead-list");
  if (!list.childNodes.length) list.replaceChildren(...skeletons(6));
  try {
    const q = $("#q").value.trim();
    const rows = await api(`/api/leads?state=${encodeURIComponent(leadState)}&q=${encodeURIComponent(q)}`);
    $("#lead-sub").textContent = rows.length === 1 ? "1 attività" : `${rows.length} attività`;
    if (!rows.length) { list.replaceChildren(el("div", { class: "glass empty" }, "Niente qui.")); return; }
    list.replaceChildren(...rows.map((l) => {
      // In "Da fare" every row is new, so the pill says what to do instead.
      const [label, cls] = l.channel === "whatsapp" ? ["Scrivere", "msg"] : l.channel === "call" ? ["Chiamare", ""]
        : STATE[l.state] || [l.state, ""];
      return el("button", { class: "glass lead", onclick: () => { haptic(); openLead(l.id); } },
        avatar(l.name, l.category),
        el("span", { class: "text" }, el("div", { class: "title" }, l.name),
          el("div", { class: "sub2 tone-" + l.tone }, el("span", { class: "glow", "aria-hidden": "true" }), el("span", {}, l.problem || [l.category, l.city].filter(Boolean).join(" · ")))),
        el("span", { class: "state " + cls }, label));
    }));
  } catch (e) { if (e.message !== "signin") toast("Non riesco a caricare"); }
}
loaders.lead = () => { requestAnimationFrame(() => { const b = $(".seg [aria-pressed=\"true\"]"); moveLens($("#seg-lens"), $(".seg"), b); }); loadLead(); };
$("#q").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadLead, 220); });
for (const b of document.querySelectorAll(".seg button")) b.addEventListener("click", () => {
  haptic(); leadState = b.dataset.state;
  for (const x of document.querySelectorAll(".seg button")) x.setAttribute("aria-pressed", x === b);
  moveLens($("#seg-lens"), $(".seg"), b);
  $("#lead-list").replaceChildren(...skeletons(5)); loadLead();
});

async function openLead(id) {

  const tel = (l.phone || "").replace(/[^\d+]/g, "");
  const note = el("textarea", { placeholder: "Aggiungi una nota…", "aria-label": "Nota" });
  const site = l.website ? (l.website.startsWith("http") ? l.website : "https://" + l.website) : null;
  openSheet(el("div", { class: "detail" },
    el("div", { style: "display:flex;justify-content:center" }, avatar(l.name, l.category)),
    el("h2", { style: "text-align:center" }, l.name),
    el("div", { class: "meta", style: "text-align:center" }, [l.category, l.city, (STATE[l.state] || [l.state])[0]].filter(Boolean).join(" · ")),
    l.phone ? el("a", { class: "call", href: "tel:" + tel, onclick: () => { closeSheet(); pendingCall = l; } }, svg(I.phone), "Chiama " + formatPhone(l.phone)) : null,
    l.wa_app ? el("a", { class: "wa", href: l.wa_app, onclick: () => { closeSheet(); pendingWa = l; } }, svg(I.bubble), "WhatsApp con il messaggio") : null,
    el("div", { class: "label" }, "Dettagli"),
    el("div", { class: "glass kv" },
      l.problem ? el("div", { class: "r" }, el("span", {}, "Problema"), el("span", {}, l.problem)) : null,
      site ? el("div", { class: "r" }, el("span", {}, "Sito"), el("a", { href: site, target: "_blank", rel: "noopener" }, site.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""))) : null,
      l.email ? el("div", { class: "r" }, el("span", {}, "Email"), el("span", {}, l.email)) : null,
      el("div", { class: "r" }, el("span", {}, "Tentativi"), el("span", { class: "num" }, String(l.attempts || 0)))),
    l.message ? [el("div", { class: "label" }, "Messaggio WhatsApp"), el("div", { class: "glass block", style: "white-space:pre-line" }, l.message)]
      : l.draft ? [el("div", { class: "label" }, "Cosa dire"), el("div", { class: "glass block" }, l.draft)] : null,
    el("button", { class: "glass cancel", onclick: () => { haptic(); closeSheet(); setTimeout(() => askOutcome(l, l.message ? "whatsapp" : "call"), 350); } }, "Registra un esito"),
    el("div", { class: "label" }, "Note"),
    l.notes ? el("div", { class: "glass block", style: "white-space:pre-wrap;color:var(--ink-2);font-size:15px" }, l.notes) : null,
    note,
    el("button", { class: "glass cancel", onclick: async () => {
      if (note.value.trim()) { await api("/api/note", { id: l.id, text: note.value.trim() }); toast("Nota salvata"); }
      closeSheet();
    } }, "Fatto")));
}

/* ── Sito ────────────────────────────────────────────── */
function delta(now, was) {
  if (!was) return null;
  const pct = Math.round((now - was) / was * 100);
  return { text: (pct > 0 ? "↑ " : pct < 0 ? "↓ " : "") + Math.abs(pct) + "% vs sett. prima", cls: pct >= 0 ? "up" : "down" };
}
function tile(k, v, d) {
  return el("div", { class: "glass tile" }, el("div", { class: "k" }, k), el("div", { class: "v num" }, v),
    el("div", { class: "d " + (d ? d.cls : "") }, d ? d.text : " "));
}

// One series: no legend (the title names it); thin columns, rounded data-end,
// square at the baseline, a 2px gap between neighbours; hairline grid; value
// on the peak and the latest day only; tap for the rest; a table for readers.
function columnChart(days) {
  const W = 340, H = 180, top = 20, bottom = 22, left = 2, right = 26;
  const max = Math.max(1, ...days.map((d) => d.visitors));
  const nice = Math.ceil(max / 10) * 10;
  const plotH = H - top - bottom, band = (W - left - right) / days.length;
  const barW = Math.min(16, band - 2), y = (v) => top + plotH - (v / nice) * plotH;
  const ns = "http://www.w3.org/2000/svg", s = document.createElementNS(ns, "svg");
  s.setAttribute("viewBox", `0 0 ${W} ${H}`); s.setAttribute("role", "img");
  s.setAttribute("aria-label", "Visitatori unici al giorno, ultimi 14 giorni");
  const add = (tag, attrs, text) => { const n = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text !== undefined) n.textContent = text; s.append(n); return n; };
  for (const g of [0, nice / 2, nice]) {
    add("line", { class: "grid", x1: left, x2: W - right, y1: y(g), y2: y(g) });
    add("text", { class: "ax", x: W, y: y(g) + 4, "text-anchor": "end" }, g);
  }
  const peak = days.reduce((a, d, i) => d.visitors > days[a].visitors ? i : a, 0);
  const wrap = el("div", { class: "glass chart" }), tip = el("div", { class: "glass tip" });
  const bars = [];
  days.forEach((d, i) => {
    const cx = left + band * i + band / 2, h = Math.max(0, (d.visitors / nice) * plotH), r = Math.min(4, h / 2, barW / 2);
    const x0 = cx - barW / 2, yb = top + plotH;
    const bar = h > 0 ? add("path", { class: "bar", d: `M${x0},${yb}V${yb - h + r}Q${x0},${yb - h} ${x0 + r},${yb - h}H${x0 + barW - r}Q${x0 + barW},${yb - h} ${x0 + barW},${yb - h + r}V${yb}Z` }) : null;
    bars.push(bar);
    if (i === peak || i === days.length - 1) add("text", { class: "dlabel num", x: cx, y: yb - h - 6, "text-anchor": "middle" }, d.visitors);
    if (i % 3 === 0 || i === days.length - 1) add("text", { class: "ax", x: cx, y: H - 5, "text-anchor": "middle" }, String(+d.date.slice(8)));
    const hit = add("rect", { class: "hit", x: left + band * i, y: 0, width: band, height: H, tabindex: 0 });
    const on = () => {
      const date = new Date(d.date + "T12:00:00").toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" });
      tip.replaceChildren(el("strong", { class: "num" }, `${d.visitors} visitatori`), `${d.views} pagine · ${date}`);
      const box = s.getBoundingClientRect(), parent = wrap.getBoundingClientRect();
      tip.style.left = Math.min(Math.max(box.left - parent.left + (cx / W) * box.width, 80), parent.width - 80) + "px";
      tip.style.top = (box.top - parent.top + ((yb - h) / H) * box.height) + "px";
      tip.classList.add("on");
      bars.forEach((b, j) => b && b.classList.toggle("dim", j !== i));
    };
    const off = () => { tip.classList.remove("on"); bars.forEach((b) => b && b.classList.remove("dim")); };
    hit.addEventListener("pointerenter", on); hit.addEventListener("click", on); hit.addEventListener("focus", on);
    hit.addEventListener("pointerleave", off); hit.addEventListener("blur", off);
  });
  const table = el("table", { class: "sr-only" }, el("caption", {}, "Visitatori al giorno"),
    el("tr", {}, el("th", {}, "Giorno"), el("th", {}, "Visitatori"), el("th", {}, "Pagine")),
    days.map((d) => el("tr", {}, el("td", {}, d.date), el("td", {}, d.visitors), el("td", {}, d.views))));
  wrap.append(el("h3", {}, "Visitatori al giorno"), el("div", { class: "caption" }, "Ultimi 14 giorni · tocca un giorno"), s, tip, table);
  return wrap;
}

async function loadSito() {
  const box = $("#site");
  if (!box.childNodes.length) box.replaceChildren(el("div", { class: "skel tall" }), el("div", { class: "tiles" }, ...skeletons(4)), el("div", { class: "skel tall", style: "margin-top:10px;height:240px" }));
  try {
    const { visitors: v, search: g } = await api("/api/site");
    const days = v?.days || [];
    const last7 = days.slice(-7).reduce((a, d) => a + d.visitors, 0), prev7 = days.slice(-14, -7).reduce((a, d) => a + d.visitors, 0);
    const okG = g && !g.error;
    box.replaceChildren(...[
      el("div", { class: "glass stat" }, el("div", { class: "n num" }, (v?.visitors ?? 0).toLocaleString("it-IT")),
        el("div", { class: "what" }, "persone hanno visitato il sito negli ultimi 14 giorni")),
      el("div", { class: "tiles" },
        // Sum of daily uniques: a person who comes back on two days counts
        // twice, so this is visits, not people - labelled as such.
        tile("Visite · 7 giorni", last7, delta(last7, prev7)),
        tile("Contatti WhatsApp", v?.contacts?.whatsapp ?? 0, null),
        okG ? tile("Clic da Google", Math.round(g.clicks), delta(g.clicks, g.prev_clicks)) : tile("Pagine viste", v?.pageviews ?? "–", null),
        okG ? tile("Posizione su Google", g.position ? g.position.toFixed(1) : "–",
          g.prev_position ? { text: `era ${g.prev_position.toFixed(1)}`, cls: g.position <= g.prev_position ? "up" : "down" } : null) : tile("Instagram", v?.contacts?.instagram ?? 0, null)),
      days.length ? columnChart(days) : null,
      okG ? el("div", { class: "footnote" }, `Google: ${Math.round(g.impressions)} apparizioni nei risultati negli ultimi 7 giorni. Search Console arriva con 2–3 giorni di ritardo.`) : null,
    ].filter(Boolean));
  } catch (e) { if (e.message !== "signin") box.replaceChildren(el("div", { class: "glass empty" }, "Dati del sito non disponibili.")); }
}
loaders.sito = loadSito;

/* ── Sistema ─────────────────────────────────────────── */
const SERVICE = { assistant: "Assistente", "9router": "Router AI", caddy: "Sito web", docker: "Container" };
async function loadSistema() {
  const box = $("#system");
  if (!box.childNodes.length) box.replaceChildren(el("div", { class: "skel", style: "height:84px;border-radius:30px" }), el("div", { class: "svc", style: "margin-top:10px" }, ...skeletons(4)));
  try {
    const s = await api("/api/system");
    const down = Object.entries(s.services).filter(([, v]) => v !== "active").map(([k]) => SERVICE[k] || k);
    const ok = !down.length && s.model.ok;
    const mem = s.memory || {}, disk = s.disk || {}, usage = Object.entries(s.usage || {});
    box.replaceChildren(
      el("div", { class: "glass health" }, el("div", { class: "orb " + (ok ? "ok" : "bad") }, svg(ok ? I.check : I.x)),
        el("div", {}, el("div", { class: "t" }, ok ? "Tutto funziona" : "Serve attenzione"),
          el("div", { class: "s" }, ok ? `Acceso da ${s.uptime}` + (s.backup ? ` · backup ${Math.round(s.backup.age_hours)} h fa` : "")
            : (down.length ? down.join(", ") + " ferm" + (down.length > 1 ? "i" : "o") : "I modelli non rispondono")))),
      el("div", { class: "label" }, "Servizi"),
      el("div", { class: "svc" }, Object.entries(s.services).map(([k, v]) => el("div", { class: "glass" },
        el("div", { class: "name" }, SERVICE[k] || k),
        el("div", { class: "st " + (v === "active" ? "ok" : "bad") }, el("i", { "aria-hidden": "true" }), v === "active" ? "Attivo" : "Fermo")))),
      el("div", { class: "label" }, "Intelligenza artificiale"),
      el("div", { class: "glass meter-row" },
        el("div", { class: "top" }, el("span", {}, "Modelli"), el("span", { class: s.model.ok ? "ok" : "bad" }, s.model.ok ? `rispondono in ${s.model.seconds.toFixed(1)} s` : "non rispondono")),
        usage.length ? el("div", { class: "footnote", style: "margin:8px 0 0" }, "Oggi: " + usage.map(([p, u]) => `${p} ${u.requests}`).join(" · ")) : null),
      el("div", { class: "label" }, "Risorse"),
      el("div", { class: "glass meter-row" }, el("div", { class: "top" }, el("span", {}, "Memoria"), el("span", { class: "num" }, `${(mem.used_gb || 0).toFixed(1)} / ${(mem.total_gb || 0).toFixed(1)} GB`)),
        el("div", { class: "meter" }, el("i", { style: `width:${Math.round(mem.percent || 0)}%` }))),
      el("div", { class: "glass meter-row" }, el("div", { class: "top" }, el("span", {}, "Disco"), el("span", { class: "num" }, `${Math.round(disk.used_gb || 0)} / ${Math.round(disk.total_gb || 0)} GB`)),
        el("div", { class: "meter" }, el("i", { style: `width:${Math.round(disk.percent || 0)}%` }))),
    );
  } catch (e) { if (e.message !== "signin") box.replaceChildren(el("div", { class: "glass empty" }, "Stato non disponibile.")); }
}
loaders.sistema = loadSistema;

/* ── start ───────────────────────────────────────────── */
function start() {
  $("#app").hidden = false; $("#tabs").hidden = false;
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  let dismissed = false; try { dismissed = localStorage.getItem("hint") === "1"; } catch {}
  if (!standalone && !dismissed && /iPhone|iPad/.test(navigator.userAgent)) $("#install-hint").classList.add("on");
  $("#hint-close").addEventListener("click", () => { $("#install-hint").classList.remove("on"); try { localStorage.setItem("hint", "1"); } catch {} });
  // Data first, geometry second: a frame callback does not fire until the
  // browser paints, which a backgrounded or pre-rendered page may not do.
  show("oggi");
}
(async () => {
  try { const me = await api("/api/me"); me.authed ? start() : showSignin(); }
  catch { showSignin(); }
})();
